<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller CT Logística — Remitos</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --azul:#1f4e78; --azul2:#2e6da4; --azulc:#ddebf7;
  --gris:#f2f4f7; --gris2:#e5e9f0; --texto:#1c2733; --borde:#cdd6e0;
  --ok:#2e7d32; --alerta:#c62828; --amarillo:#fff3cd;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--texto);background:var(--gris);font-size:15px}
header{background:var(--azul);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;margin:0;font-weight:700}
header .cuit{font-size:11px;opacity:.8;margin-left:auto}
nav{display:flex;background:var(--azul2);position:sticky;top:44px;z-index:9}
nav button{flex:1;background:none;border:none;color:#dbe7f3;padding:11px 4px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button.activo{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.08)}
main{padding:14px;max-width:820px;margin:0 auto}
.card{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:14px;margin-bottom:14px}
h2{font-size:16px;color:var(--azul);margin:0 0 12px}
label{display:block;font-size:12px;font-weight:600;color:#556;margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--borde);border-radius:6px;font-size:15px;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul2)}
textarea{resize:vertical;min-height:52px}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.btn{background:var(--azul);color:#fff;border:none;border-radius:6px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn:active{opacity:.85}
.btn.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}
.btn.mini{padding:6px 10px;font-size:13px}
.btn.del{background:#fff;color:var(--alerta);border:1px solid var(--alerta)}
.btn.full{width:100%;margin-top:14px}
.item-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.item-row .desc{flex:1}.item-row .prc{width:120px}
.item-row .x{background:#fff;color:var(--alerta);border:1px solid var(--alerta);border-radius:6px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:none;margin-top:0}
.total-box{display:flex;justify-content:space-between;align-items:center;background:var(--azulc);border-radius:6px;padding:12px 14px;margin-top:12px;font-weight:700;color:var(--azul);font-size:18px}
.msg{padding:10px 12px;border-radius:6px;margin-bottom:12px;font-size:14px;display:none}
.msg.ok{background:#e8f5e9;color:var(--ok);display:block}
.msg.err{background:#ffebee;color:var(--alerta);display:block}
.remito-item{border:1px solid var(--borde);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
.remito-item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.remito-item .nro{font-weight:700;color:var(--azul)}
.remito-item .cli{font-weight:600}
.remito-item .meta{font-size:12px;color:#667;margin-top:2px}
.remito-item .tot{font-weight:700;color:var(--azul);white-space:nowrap}
.remito-item .acc{display:flex;gap:8px;margin-top:10px}
.buscar{margin-bottom:12px}
table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res th,table.res td{border:1px solid var(--borde);padding:7px 8px;text-align:right}
table.res th{background:var(--azul);color:#fff;text-align:center;font-size:12px}
table.res td.cli,table.res th.cli{text-align:left;font-weight:600}
table.res tr.tot td{background:var(--azulc);font-weight:700;color:var(--azul)}
table.res td.cero{color:#aaa}
.chip{display:inline-block;background:var(--gris2);border-radius:12px;padding:3px 10px;font-size:13px;margin:0 6px 6px 0}
.chip button{background:none;border:none;color:var(--alerta);cursor:pointer;font-size:14px;margin-left:4px;padding:0}
.aviso-config{background:var(--amarillo);border:1px solid #e0c97f;padding:14px;border-radius:8px;color:#664d03;font-size:14px;line-height:1.5}
.vacio{text-align:center;color:#889;padding:30px 10px}
/* ---------- Impresión del remito ---------- */
#print-area{display:none}
@media print{
  header,nav,main{display:none!important}
  #print-area{display:block!important}
  @page{size:A4;margin:12mm}
}
#print-area{font-family:Arial,sans-serif;color:#000;font-size:12px}
.pr-box{border:2px solid #000;padding:0}
.pr-head{display:flex;border-bottom:2px solid #000}
.pr-head .emisor{flex:1;padding:8px 10px;border-right:2px solid #000}
.pr-head .emisor h3{color:var(--azul);font-size:20px;margin:0 0 6px;text-align:center}
.pr-head .emisor .lin{display:flex;font-size:11px;margin:1px 0}
.pr-head .emisor .lin b{width:78px;display:inline-block}
.pr-head .doc{width:170px;padding:8px 10px}
.pr-head .doc .nv{font-size:8px;text-align:center;margin-bottom:6px}
.pr-head .doc .t{font-size:18px;font-weight:700;text-align:center;margin-bottom:10px}
.pr-head .doc .lin{display:flex;justify-content:space-between;font-size:12px;margin:3px 0}
.pr-cli{border-bottom:2px solid #000;padding:8px 10px;font-size:12px}
.pr-cli .lin{display:flex;margin:2px 0}
.pr-cli .lin b{width:70px}
.pr-t{width:100%;border-collapse:collapse}
.pr-t th{background:#d9d9d9;border:1px solid #000;padding:4px;font-size:11px}
.pr-t td{border:1px solid #000;padding:5px 6px;font-size:12px;vertical-align:top}
.pr-t td.art{text-align:center;width:60px}
.pr-t td.prc{text-align:right;width:120px;white-space:nowrap}
.pr-t tr.tot td{font-weight:700}
.pr-firma{border-top:2px solid #000;padding:22px 10px 10px;display:flex;justify-content:space-between;align-items:flex-end;font-size:12px}
.pr-firma .fs{border-top:1px solid #000;padding-top:3px;width:230px;text-align:center;font-weight:700}
</style>
</head>
<body>

<header>
  <h1>Taller CT Logística</h1>
  <span class="cuit">CUIT 30/71639600-9</span>
</header>

<nav id="nav">
  <button data-v="nuevo" class="activo" onclick="showView('nuevo')">Nuevo remito</button>
  <button data-v="lista" onclick="showView('lista')">Remitos</button>
  <button data-v="resumen" onclick="showView('resumen')">Resumen</button>
  <button data-v="clientes" onclick="showView('clientes')">Clientes</button>
</nav>

<main>
  <div id="aviso-config" class="aviso-config" style="display:none">
    <b>Falta conectar Firebase.</b> Pegá la config del proyecto <b>taller-app</b> en el bloque
    <code>firebaseConfig</code> arriba del <code>&lt;script&gt;</code> de este archivo y volvé a subirlo.
  </div>

  <!-- ====== NUEVO / EDITAR REMITO ====== -->
  <section id="v-nuevo" class="vista">
    <div class="card">
      <h2 id="titulo-form">Nuevo remito</h2>
      <div id="msg-form" class="msg"></div>
      <input type="hidden" id="edit-id">
      <div class="row2">
        <div><label>N° Remito</label><input id="f-nro" inputmode="numeric" placeholder="0038"></div>
        <div><label>Fecha</label><input id="f-fecha" type="date"></div>
      </div>
      <label>Cliente</label>
      <select id="f-cliente"><option value="">— elegí un cliente —</option></select>
      <div class="row2">
        <div><label>Vehículo</label><input id="f-vehiculo" placeholder="Scania / Mercedes 1620…"></div>
        <div><label>Patente</label><input id="f-patente" placeholder="OLD467"></div>
      </div>
      <div class="row2">
        <div><label>N° Orden de trabajo</label><input id="f-ot" inputmode="numeric" placeholder="028"></div>
        <div><label>Chofer</label><input id="f-chofer" placeholder="Víctor Hugo"></div>
      </div>

      <label>Ítems del trabajo</label>
      <div id="items"></div>
      <button class="btn sec mini" onclick="addItem()">+ Agregar ítem</button>

      <div class="total-box"><span>TOTAL</span><span id="f-total">$0</span></div>

      <label>Observaciones</label>
      <textarea id="f-obs" placeholder="Ej: materiales traídos por el cliente / trabajo realizado por…"></textarea>

      <button class="btn full" onclick="guardarRemito()">Guardar remito</button>
      <button id="btn-cancelar" class="btn sec full" style="display:none" onclick="resetForm()">Cancelar edición</button>
    </div>
  </section>

  <!-- ====== LISTADO ====== -->
  <section id="v-lista" class="vista" style="display:none">
    <div class="card">
      <h2>Remitos</h2>
      <input class="buscar" id="buscar" placeholder="Buscar por cliente, N°, patente…" oninput="renderLista()">
      <div id="lista-remitos"></div>
    </div>
  </section>

  <!-- ====== RESUMEN ====== -->
  <section id="v-resumen" class="vista" style="display:none">
    <div class="card">
      <h2>Resumen por mes y cliente</h2>
      <div id="tabla-resumen"></div>
    </div>
  </section>

  <!-- ====== CLIENTES ====== -->
  <section id="v-clientes" class="vista" style="display:none">
    <div class="card">
      <h2>Clientes</h2>
      <div class="row2">
        <div style="flex:2"><input id="nuevo-cliente" placeholder="Nombre del cliente"></div>
        <div style="flex:none"><button class="btn" onclick="addCliente()">Agregar</button></div>
      </div>
      <div id="lista-clientes" style="margin-top:14px"></div>
    </div>
  </section>
</main>

<div id="print-area"></div>

<script>
/* ============================================================
   1) CONFIG FIREBASE  —  pegá acá la config de taller-app
   (Firebase console ▸ Configuración del proyecto ▸ Tus apps ▸ SDK)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyB-0oErS5Hio89OEAW6c7amnV_rOlrbSDI",
  authDomain: "taller-app-2bdfb.firebaseapp.com",
  projectId: "taller-app-2bdfb",
  storageBucket: "taller-app-2bdfb.firebasestorage.app",
  messagingSenderId: "497959175865",
  appId: "1:497959175865:web:7cff387636bf11aa5cbd68"
};
/* ============================================================ */

let db=null, remitos=[], clientes=[];
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function configOK(){ return firebaseConfig.projectId && firebaseConfig.projectId!=="PEGAR_AQUI"; }

function initApp(){
  if(!configOK()){ document.getElementById('aviso-config').style.display='block'; return; }
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  escucharClientes();
  escucharRemitos();
  const hoy=new Date();
  document.getElementById('f-fecha').value=hoy.toISOString().slice(0,10);
  addItem();
}

/* ---------- Utilidades ---------- */
function fmt(n){ n=Math.round(n||0); return "$"+n.toLocaleString("es-AR"); }
function parsePrecio(v){ // pesos enteros, sin centavos: se descarta todo lo que no sea dígito
  if(v==null) return 0;
  const s=String(v).replace(/[^\d]/g,"");
  return s?parseInt(s,10):0;
}
function mesLabel(fecha){ // "2026-06-18" -> "Junio 2026"
  if(!fecha) return "Sin fecha";
  const [y,m]=fecha.split("-");
  return MESES[parseInt(m,10)-1]+" "+y;
}
function mesKey(fecha){ return fecha?fecha.slice(0,7):"0000-00"; } // orden cronológico
function msg(id,texto,tipo){ const e=document.getElementById(id); e.textContent=texto; e.className="msg "+tipo;
  if(tipo==="ok") setTimeout(()=>{e.className="msg";},3000); }

/* ---------- Navegación ---------- */
function showView(v){
  document.querySelectorAll('.vista').forEach(s=>s.style.display='none');
  document.getElementById('v-'+v).style.display='block';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('activo',b.dataset.v===v));
  if(v==='resumen') renderResumen();
  if(v==='lista') renderLista();
  window.scrollTo(0,0);
}

/* ---------- Clientes ---------- */
function escucharClientes(){
  db.collection('clientes').orderBy('nombre').onSnapshot(snap=>{
    clientes=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderClientes(); renderSelectClientes();
  });
}
function addCliente(){
  const inp=document.getElementById('nuevo-cliente');
  const nombre=inp.value.trim().toUpperCase();
  if(!nombre) return;
  if(clientes.some(c=>c.nombre===nombre)){ alert("Ese cliente ya existe."); return; }
  db.collection('clientes').add({nombre}); inp.value="";
}
function borrarCliente(id){
  if(!confirm("¿Borrar este cliente de la lista?")) return;
  db.collection('clientes').doc(id).delete();
}
function renderClientes(){
  const cont=document.getElementById('lista-clientes');
  if(!clientes.length){ cont.innerHTML='<div class="vacio">Todavía no cargaste clientes.</div>'; return; }
  cont.innerHTML=clientes.map(c=>`<span class="chip">${c.nombre}<button onclick="borrarCliente('${c.id}')">✕</button></span>`).join("");
}
function renderSelectClientes(){
  const sel=document.getElementById('f-cliente'); const actual=sel.value;
  sel.innerHTML='<option value="">— elegí un cliente —</option>'+clientes.map(c=>`<option>${c.nombre}</option>`).join("");
  sel.value=actual;
}

/* ---------- Ítems del remito ---------- */
function addItem(desc="",prc=""){
  const div=document.createElement('div'); div.className='item-row';
  div.innerHTML=`
    <textarea class="desc" placeholder="Descripción del trabajo" oninput="recalc()">${desc}</textarea>
    <input class="prc" inputmode="numeric" placeholder="$" value="${prc}" oninput="recalc()">
    <button class="x" onclick="this.parentNode.remove();recalc()">✕</button>`;
  document.getElementById('items').appendChild(div); recalc();
}
function leerItems(){
  return [...document.querySelectorAll('#items .item-row')].map(r=>({
    descripcion:r.querySelector('.desc').value.trim(),
    precio:parsePrecio(r.querySelector('.prc').value)
  })).filter(i=>i.descripcion||i.precio);
}
function recalc(){
  const t=leerItems().reduce((a,i)=>a+i.precio,0);
  document.getElementById('f-total').textContent=fmt(t);
}

/* ---------- Guardar / editar remito ---------- */
function guardarRemito(){
  const nro=document.getElementById('f-nro').value.trim();
  const fecha=document.getElementById('f-fecha').value;
  const cliente=document.getElementById('f-cliente').value;
  const items=leerItems();
  if(!nro){ msg('msg-form','Falta el N° de remito.','err'); return; }
  if(!fecha){ msg('msg-form','Falta la fecha.','err'); return; }
  if(!cliente){ msg('msg-form','Elegí un cliente.','err'); return; }
  if(!items.length){ msg('msg-form','Cargá al menos un ítem.','err'); return; }
  const total=items.reduce((a,i)=>a+i.precio,0);
  const editId=document.getElementById('edit-id').value;
  // aviso de N° duplicado (solo al crear)
  if(!editId && remitos.some(r=>r.nro===nro)){
    if(!confirm("Ya existe un remito N° "+nro+". ¿Guardar igual?")) return;
  }
  const data={nro,fecha,cliente,
    vehiculo:document.getElementById('f-vehiculo').value.trim(),
    patente:document.getElementById('f-patente').value.trim().toUpperCase(),
    ot:document.getElementById('f-ot').value.trim(),
    chofer:document.getElementById('f-chofer').value.trim(),
    obs:document.getElementById('f-obs').value.trim(),
    items,total,
    actualizado:Date.now()};
  const p= editId
    ? db.collection('remitos').doc(editId).update(data)
    : db.collection('remitos').add({...data,creado:Date.now()});
  p.then(()=>{ resetForm(); msg('msg-form','Remito guardado.','ok'); })
   .catch(e=>msg('msg-form','Error al guardar: '+e.message,'err'));
}
function resetForm(){
  document.getElementById('edit-id').value="";
  document.getElementById('titulo-form').textContent="Nuevo remito";
  document.getElementById('btn-cancelar').style.display="none";
  ['f-nro','f-vehiculo','f-patente','f-ot','f-chofer','f-obs'].forEach(i=>document.getElementById(i).value="");
  document.getElementById('f-cliente').value="";
  document.getElementById('f-fecha').value=new Date().toISOString().slice(0,10);
  document.getElementById('items').innerHTML=""; addItem();
}
function editar(id){
  const r=remitos.find(x=>x.id===id); if(!r) return;
  document.getElementById('edit-id').value=id;
  document.getElementById('titulo-form').textContent="Editar remito N° "+r.nro;
  document.getElementById('btn-cancelar').style.display="block";
  document.getElementById('f-nro').value=r.nro||"";
  document.getElementById('f-fecha').value=r.fecha||"";
  document.getElementById('f-cliente').value=r.cliente||"";
  document.getElementById('f-vehiculo').value=r.vehiculo||"";
  document.getElementById('f-patente').value=r.patente||"";
  document.getElementById('f-ot').value=r.ot||"";
  document.getElementById('f-chofer').value=r.chofer||"";
  document.getElementById('f-obs').value=r.obs||"";
  document.getElementById('items').innerHTML="";
  (r.items||[]).forEach(i=>addItem(i.descripcion,i.precio));
  if(!(r.items||[]).length) addItem();
  showView('nuevo');
}
function borrarRemito(id){
  const r=remitos.find(x=>x.id===id);
  if(!confirm("¿Borrar el remito N° "+(r?r.nro:"")+"? No se puede deshacer.")) return;
  db.collection('remitos').doc(id).delete();
}

/* ---------- Escuchar remitos ---------- */
function escucharRemitos(){
  db.collection('remitos').onSnapshot(snap=>{
    remitos=snap.docs.map(d=>({id:d.id,...d.data()}));
    remitos.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.nro||"").localeCompare(a.nro||""));
    renderLista(); if(document.getElementById('v-resumen').style.display!=='none') renderResumen();
  });
}

/* ---------- Render listado ---------- */
function renderLista(){
  const cont=document.getElementById('lista-remitos');
  const q=(document.getElementById('buscar').value||"").toLowerCase();
  const filtrados=remitos.filter(r=>!q||[r.nro,r.cliente,r.patente,r.vehiculo,r.chofer].join(" ").toLowerCase().includes(q));
  if(!filtrados.length){ cont.innerHTML='<div class="vacio">'+(remitos.length?'Sin resultados.':'Todavía no hay remitos cargados.')+'</div>'; return; }
  cont.innerHTML=filtrados.map(r=>`
    <div class="remito-item">
      <div class="top">
        <div>
          <span class="nro">N° ${r.nro||"—"}</span> · <span class="cli">${r.cliente||""}</span>
          <div class="meta">${fmtFecha(r.fecha)} · ${r.patente||r.vehiculo||""} ${r.ot?"· OT "+r.ot:""}</div>
        </div>
        <div class="tot">${fmt(r.total)}</div>
      </div>
      <div class="acc">
        <button class="btn mini sec" onclick="imprimirRemito('${r.id}')">Imprimir</button>
        <button class="btn mini sec" onclick="editar('${r.id}')">Editar</button>
        <button class="btn mini del" onclick="borrarRemito('${r.id}')">Borrar</button>
      </div>
    </div>`).join("");
}
function fmtFecha(f){ if(!f) return ""; const [y,m,d]=f.split("-"); return `${d}-${m}-${y}`; }

/* ---------- Resumen por mes y cliente ---------- */
function renderResumen(){
  const cont=document.getElementById('tabla-resumen');
  if(!remitos.length){ cont.innerHTML='<div class="vacio">Todavía no hay datos para resumir.</div>'; return; }
  const meses=[...new Set(remitos.map(r=>mesKey(r.fecha)))].sort();
  const clis=[...new Set(remitos.map(r=>r.cliente||"—"))].sort();
  const tot={}; clis.forEach(c=>tot[c]={}); const totMes={}, totCli={}; let gran=0;
  remitos.forEach(r=>{ const c=r.cliente||"—", k=mesKey(r.fecha);
    tot[c][k]=(tot[c][k]||0)+(r.total||0);
    totMes[k]=(totMes[k]||0)+(r.total||0);
    totCli[c]=(totCli[c]||0)+(r.total||0); gran+=(r.total||0); });
  let h='<div style="overflow-x:auto"><table class="res"><tr><th class="cli">Cliente \\ Mes</th>';
  meses.forEach(k=>h+=`<th>${mesLabel(k+"-01")}</th>`);
  h+='<th>Total</th></tr>';
  clis.forEach(c=>{ h+=`<tr><td class="cli">${c}</td>`;
    meses.forEach(k=>{ const v=tot[c][k]||0; h+=`<td class="${v?'':'cero'}">${v?fmt(v):'—'}</td>`; });
    h+=`<td><b>${fmt(totCli[c])}</b></td></tr>`; });
  h+='<tr class="tot"><td class="cli">Total mes</td>';
  meses.forEach(k=>h+=`<td>${fmt(totMes[k])}</td>`);
  h+=`<td>${fmt(gran)}</td></tr></table></div>`;
  h+=`<p style="font-size:13px;color:#667;margin-top:10px">${remitos.length} remito(s) · Total general <b>${fmt(gran)}</b></p>`;
  cont.innerHTML=h;
}

/* ---------- Impresión del remito (formato CT Logística) ---------- */
function imprimirRemito(id){
  const r=remitos.find(x=>x.id===id); if(!r) return;
  const filas=(r.items||[]).map((i,idx)=>`
    <tr><td class="art">${idx===0?'1':''}</td>
        <td>${(i.descripcion||"").replace(/\n/g,"<br>")}</td>
        <td class="prc">${i.precio?fmt(i.precio):''}</td></tr>`).join("");
  const vacias=Array.from({length:Math.max(0,8-(r.items||[]).length)}).map(()=>'<tr><td class="art">&nbsp;</td><td></td><td class="prc"></td></tr>').join("");
  document.getElementById('print-area').innerHTML=`
    <div class="pr-box">
      <div class="pr-head">
        <div class="emisor">
          <h3>CT LOGISTICA SA</h3>
          <div class="lin"><b>Teléfono</b>2617067267 / 2615005260</div>
          <div class="lin"><b>CUIT</b>30/71639600-9</div>
